<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a33">
  <meta name="description" content="Sistema de gestão técnica e financeira Nicolau Assistance.">
  <meta name="application-name" content="Nicolau Assistance">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nicolau Assistance">
  <title>Nicolau Assistance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script>
  <script src="config.js"></script>
</head>
<body>
<div id="loginView" class="login-wrap">
  <section class="login-card"><img src="assets/logo.png" class="login-logo" onerror="this.style.display='none'" alt="Nicolau Assistance">
    <div class="eyebrow">GESTÃO TÉCNICA E FINANCEIRA</div><h1>NICOLAU <span>ASSISTANCE</span></h1><p class="muted">Aceda ao sistema de gestão</p>
    <form id="loginForm"><label>Email</label><input id="loginEmail" type="email" required placeholder="admin@empresa.com"><label>Palavra-passe</label><input id="loginPassword" type="password" required placeholder="A sua palavra-passe"><button class="primary full">Entrar no sistema</button></form>
    <p id="loginError" class="error"></p>
    <button type="button" id="installAppBtn" class="secondary install-btn">＋ Instalar no ecrã inicial</button>
    <p class="tiny muted">Acesso protegido por autenticação Supabase.</p>
  </section>
</div>
<div id="appView" class="app hidden">
  <aside class="sidebar"><div class="brand"><img src="assets/logo.png" onerror="this.style.display='none'" alt=""><div><b>NICOLAU<br>ASSISTANCE</b><small>ASSISTÊNCIA TÉCNICA</small></div></div>
    <nav id="nav"><button data-page="dashboard" class="active">▦ <span>Painel principal</span></button><button data-page="orders">▤ <span>Ordens de serviço</span></button><button data-page="clients">♙ <span>Clientes</span></button><button data-page="stock">▣ <span>Estoque</span></button><button data-page="services">⚒ <span>Serviços</span></button><button data-page="cash">＄ <span>Caixa</span></button><button data-page="history" >◷ <span>Histórico</span></button></nav>
    <div class="side-bottom"><div class="user-chip"><span class="avatar">NA</span><div><b id="userName">Utilizador</b><small id="userRole">Funcionário</small></div></div><button id="logoutBtn" class="logout">↪ Terminar sessão</button></div>
  </aside>
  <main class="main"><header class="topbar"><div><div class="eyebrow">SISTEMA DE GESTÃO</div><h2 id="pageTitle">Painel principal</h2></div><div class="top-right"><button type="button" id="installAppBtnTop" class="secondary install-btn">＋ Instalar app</button><span class="online-dot" id="connDot">● A ligar…</span><span id="todayLabel"></span></div></header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<dialog id="modal"><form method="dialog" id="modalForm"><div class="modal-head"><h3 id="modalTitle">Registo</h3><button class="icon-btn" value="cancel" aria-label="Fechar">×</button></div><div id="modalBody"></div><div class="modal-actions"><button class="secondary" value="cancel">Cancelar</button><button id="modalSave" class="primary" value="default">Guardar</button></div></form></dialog>
<script src="app.js"></script><script src="pwa.js"></script>
</body></html>
